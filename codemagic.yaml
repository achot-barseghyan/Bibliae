workflows:
  ios-release:
    name: Bibliae iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bibliae.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6822832756
      node: 22
      xcode: latest
    scripts:
      - name: Installer les dépendances
        script: npm ci
      - name: Build web + sync Capacitor
        script: |
          npm run build
          npx cap sync ios
      - name: Signature
        script: xcode-project use-profiles
      - name: Numéro de build
        script: |
          cd ios/App
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          LOCAL=$(agvtool what-version -terse)
          LAST=$(printf '%s\n' "${TF:-0}" "${AS:-0}" "${LOCAL:-0}" | sort -n | tail -1)
          echo "TestFlight=$TF AppStore=$AS local=$LOCAL -> build $(($LAST + 1))"
          agvtool new-version -all $(($LAST + 1))
      - name: Build IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
